[build]
  publish = "public"

# CJdropshipping product photos, served through the Image CDN.
[images]
  remote_images = ["https://.*\\.cjdropshipping\\.com/.*", "https://.*\\.aliyuncs\\.com/.*", "https://.*\\.alicdn\\.com/.*"]

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/products/:slug"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/order"
  to = "/order.html"
  status = 200

[[redirects]]
  from = "/funnel"
  to = "/funnel.html"
  status = 200

[[redirects]]
  from = "/offer"
  to = "/funnel.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/funnel"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/offer"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/order.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# app.js and styles.css are not fingerprinted, so they must revalidate on every
# load (cheap 304 via ETag) or returning visitors keep stale code for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/guides/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
