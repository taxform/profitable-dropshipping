<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order — Skabba Deals</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3ede4">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,50&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap prose" data-order>
    <h1>Track an order</h1>
    <p>Enter the order number from your confirmation email.</p>
    <form class="lookup" data-lookup><input class="field" name="id" placeholder="SD-XXXXXXXX" required aria-label="Order number"><button class="btn">Look up</button></form>
  </main>
  <script type="module">
    import { money, clearCart, track } from '/app.js'
    const params = new URLSearchParams(location.search)
    const id = params.get('id')
    const main = document.querySelector('[data-order]')
    document.querySelector('[data-lookup]').addEventListener('submit', (e) => {
      e.preventDefault()
      location.search = '?id=' + encodeURIComponent(e.target.id.value.trim().toUpperCase())
    })
    if (id) {
      if (params.get('paid')) clearCart()
      const res = await fetch('/api/order?id=' + encodeURIComponent(id))
      const o = await res.json()
      if (!res.ok) {
        main.insertAdjacentHTML('beforeend', `<p class="err">We couldn't find order ${id.replace(/[<>&]/g, '')}. Check the number and try again.</p>`)
      } else {
        // GA4 / Google Ads purchase conversion. Fires once per order (guarded by sessionStorage).
        try {
          if (params.get('paid') && (o.status === 'paid' || o.status === 'ordered' || o.status === 'shipped' || o.status === 'delivered')) {
            const key = 'sd-purchase-' + o.id
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1')
              track('purchase', {
                currency: 'USD',
                transaction_id: o.id,
                value: Number((o.total / 100).toFixed(2)),
                shipping: Number(((o.shipping || 0) / 100).toFixed(2)),
                items: (o.items || []).map((l) => ({ item_id: l.slug || l.name, item_name: l.name, quantity: l.qty, price: Number(((l.unit || 0) / 100).toFixed(2)) })),
              })
            }
          }
        } catch {}
        const flow = ['paid', 'ordered', 'shipped', 'delivered']
        const at = flow.indexOf(o.status)
        const headline = {
          pending_payment: params.get('paid') ? 'Payment received — confirming…' : 'Order reserved',
          paid: 'Thank you! Your order is confirmed.',
          ordered: 'Your order is being prepared.',
          shipped: 'Your order is on its way.',
          delivered: 'Delivered. Enjoy!',
          cancelled: 'This order was cancelled.',
          refunded: 'This order was refunded.',
        }[o.status]
        main.innerHTML = `<div class="eyebrow">Order ${o.id}</div><h1>${headline}</h1>
          ${o.status === 'pending_payment' && !params.get('paid') ? `<p>Online payment isn't switched on yet, so we've saved your order and will email you a secure payment link shortly. Nothing has been charged.</p>` : '<p>A confirmation is on its way to your inbox. Tracking follows as soon as your parcel ships.</p>'}
          <div class="status-card">
            ${at >= 0 ? `<div class="steps">${['Confirmed', 'Preparing', 'Shipped', 'Delivered'].map((s, i) => `<div class="${i <= at ? 'on' : ''}">${s}</div>`).join('')}</div>` : ''}
            ${o.trackingNumber ? `<p><b>Tracking:</b> <a href="https://parcelsapp.com/en/tracking/${encodeURIComponent(o.trackingNumber)}" target="_blank" rel="noopener">${o.trackingNumber.replace(/[<>&]/g, '')}</a></p>` : ''}
            ${o.items.map((l) => `<div class="row"><span>${l.qty} × ${l.name}</span><span>${money(l.unit * l.qty)}</span></div>`).join('')}
            <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
            ${o.discount ? `<div class="row save"><span>You saved</span><span>${money(o.discount)}</span></div>` : ''}
            <div class="row"><span>Shipping</span><span>${o.shipping ? money(o.shipping) : 'Free'}</span></div>
            <div class="row total"><span>Total</span><span>${money(o.total)}</span></div>
          </div>
          <p style="margin-top:28px"><a class="btn btn--ghost" href="/#shop">Keep shopping</a></p>
          <div data-upsell style="margin-top:20px"></div>`
        // Funnel buyers get a one-time add-on offer right on the thank-you page.
        // It starts a separate express checkout (same Stripe flow), never an automatic charge.
        const slot = main.querySelector('[data-upsell]')
        if (slot && params.get('paid') && params.get('funnel') && (o.status === 'paid' || o.status === 'ordered' || o.status === 'shipped')) {
          try {
            const { products } = await fetch('/api/products').then((r) => r.json())
            const bought = new Set(o.items.map((l) => l.name))
            const extra = products.filter((p) => !bought.has(p.name)).sort((a, b) => a.price - b.price)[0]
            if (extra) {
              const esc2 = (s) => String(s).replace(/[<>&"]/g, '')
              slot.innerHTML = `<div class="status-card" style="border:1px dashed var(--clay)">
                <div class="eyebrow">One-time add-on · only on this page</div>
                <h2 style="font-size:28px;margin:8px 0">Add the ${esc2(extra.name)} for ${money(extra.price)}</h2>
                <p>${esc2(extra.tagline)} Ships with tracked delivery, covered by the same 30-day guarantee.</p>
                <form data-upsell-form style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
                  <input class="field" type="email" name="email" required placeholder="you@example.com" aria-label="Email address" style="flex:1;min-width:220px" value="${esc2(localStorage.getItem('sd-email') || '')}">
                  <button class="btn" type="submit">Add it · ${money(extra.price)}</button>
                </form><div class="err" data-upsell-err></div>
                <p class="muted" style="font-size:12px;margin:8px 0 0">Starts a separate express checkout — your original order is untouched.</p>
              </div>`
              slot.querySelector('[data-upsell-form]').addEventListener('submit', async (e) => {
                e.preventDefault()
                const email = e.target.email.value.trim().toLowerCase()
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { slot.querySelector('[data-upsell-err]').textContent = 'Enter your email so we can send tracking.'; return }
                try { localStorage.setItem('sd-email', email) } catch {}
                const btn = e.target.querySelector('button')
                btn.disabled = true; btn.textContent = 'Opening secure checkout…'
                const res = await fetch('/api/checkout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, items: [{ slug: extra.slug, qty: 1 }], funnel: params.get('funnel') }) })
                const data = await res.json()
                if (!res.ok) throw new Error(data.error || 'Checkout failed')
                location.href = data.redirect
              })
            }
          } catch {}
        }
        const tries = Number(sessionStorage.getItem('sd-poll-' + o.id) || 0)
        if (o.status === 'pending_payment' && params.get('paid') && tries < 6) {
          sessionStorage.setItem('sd-poll-' + o.id, tries + 1)
          setTimeout(() => location.reload(), 2500)
        }
      }
    }
  </script>
</body>
</html>
