<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skabba Deals — Kitchen gadgets that earn their counter space</title>
  <meta name="description" content="Clever, tested kitchen gadgets at fair prices. Free tracked shipping over $49, buy 2 save 10%, buy 3+ save 20%, and 30-day returns.">
  <link rel="canonical" href="https://skabbadeals.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Skabba Deals">
  <meta property="og:title" content="Skabba Deals — Kitchen gadgets that earn their counter space">
  <meta property="og:description" content="Free tracked shipping over $49. Buy 2 save 10%, buy 3+ save 20%.">
  <meta property="og:image" content="https://skabbadeals.com/.netlify/images?url=/images/spice-grinder.png&w=1200&h=630&fit=cover">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Skabba Deals — Kitchen gadgets that earn their counter space">
  <meta name="twitter:description" content="Free tracked shipping over $49. Buy 2 save 10%, buy 3+ save 20%.">
  <meta name="theme-color" content="#f3ede4">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,50&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ABCDEFGH" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <main class="pdp" data-pdp>
    <div class="wrap"><div class="pdp__media skeleton"></div><div><div class="skeleton" style="height:60px;width:80%"></div><div class="skeleton" style="height:180px;margin-top:24px"></div></div></div>
  </main>
  <section class="section" style="padding-bottom:0"><div class="wrap">
    <div class="section-head"><div><div class="eyebrow">Complete the set</div><h2>Add two, save 20%</h2></div></div>
    <div class="grid grid--even" data-related></div>
  </div></section>

  <script type="module">
    import { getCatalog, money, img, addToCart, track } from '/app.js'
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
    const slug = location.pathname.split('/').filter(Boolean).pop()
    const { products, offers } = await getCatalog()
    const p = products.find((x) => x.slug === slug)
    const main = document.querySelector('[data-pdp]')
    const setMeta = (name, attr, value) => {
      let el = document.head.querySelector(`meta[${attr}="${name}"]`)
      if (!el) {
        el = document.createElement('meta')
        el.setAttribute(attr, name)
        document.head.appendChild(el)
      }
      el.setAttribute('content', value)
    }
    if (!p) {
      main.innerHTML = `<div class="wrap"><div class="empty"><h3>We couldn't find that gadget</h3><p>It may have sold out or moved.</p><a class="btn" href="/#shop">Back to the shop</a></div></div>`
    } else {
      const url = `https://skabbadeals.com/products/${p.slug}`
      const desc = `${p.tagline} ${p.description}`.slice(0, 158)
      const shareImg = `https://skabbadeals.com/.netlify/images?url=${encodeURIComponent(p.image)}&w=1200&h=630&fit=cover`
      try { track('view_item', { currency: 'USD', value: Number((p.price / 100).toFixed(2)), items: [{ item_id: p.slug, item_name: p.name, item_category: p.category, price: Number((p.price / 100).toFixed(2)), quantity: 1 }] }) } catch {}
      document.title = `${p.name} — Skabba Deals`
      document.querySelector('meta[name=description]').content = desc
      document.head.insertAdjacentHTML('beforeend', `<link rel="canonical" href="${url}">`)
      setMeta('og:title', 'property', `${p.name} — Skabba Deals`)
      setMeta('og:description', 'property', desc)
      setMeta('og:url', 'property', url)
      setMeta('og:type', 'property', 'product')
      setMeta('og:image', 'property', shareImg)
      setMeta('twitter:title', 'name', `${p.name} — Skabba Deals`)
      setMeta('twitter:description', 'name', desc)
      setMeta('twitter:image', 'name', shareImg)
      setMeta('twitter:card', 'name', 'summary_large_image')
      document.head.insertAdjacentHTML('beforeend', `<script type="application/ld+json">${JSON.stringify({
        '@context': 'https://schema.org', '@type': 'Product', name: p.name, description: p.description, image: p.image.startsWith('http') ? p.image : `https://skabbadeals.com${p.image}`, sku: p.slug, category: p.category, brand: { '@type': 'Brand', name: 'Skabba Deals' },
        seller: { '@type': 'Organization', name: 'Skabba Deals', url: 'https://skabbadeals.com/' },
        offers: { '@type': 'Offer', url, priceCurrency: 'USD', price: (p.price / 100).toFixed(2), itemCondition: 'https://schema.org/NewCondition', availability: 'https://schema.org/InStock',
          seller: { '@type': 'Organization', name: 'Skabba Deals', url: 'https://skabbadeals.com/' },
          shippingDetails: { '@type': 'OfferShippingDetails', shippingDestination: { '@type': 'DefinedRegion', addressCountry: 'US' },
            deliveryTime: { '@type': 'ShippingDeliveryTime', handlingTime: { '@type': 'QuantitativeValue', minValue: 1, maxValue: 2, unitCode: 'DAY' }, transitTime: { '@type': 'QuantitativeValue', minValue: 6, maxValue: 12, unitCode: 'DAY' } } },
          hasMerchantReturnPolicy: { '@type': 'MerchantReturnPolicy', returnPolicyCategory: 'https://schema.org/MerchantReturnFiniteReturnWindow', merchantReturnDays: 30, returnMethod: 'https://schema.org/ReturnByMail' } },
      })}<\/script>`)
      document.head.insertAdjacentHTML('beforeend', `<script type="application/ld+json">${JSON.stringify({
        '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: [
          { '@type': 'ListItem', position: 1, name: 'Home', item: 'https://skabbadeals.com/' },
          { '@type': 'ListItem', position: 2, name: p.category, item: 'https://skabbadeals.com/#shop' },
          { '@type': 'ListItem', position: 3, name: p.name },
        ],
      })}<\/script>`)
      const off = p.compareAt ? Math.round((1 - p.price / p.compareAt) * 100) : 0
      const t2 = offers.bundleTiers.find((t) => t.minQty === 2).pct
      const t3 = offers.bundleTiers.find((t) => t.minQty === 3).pct
      const opt = (qty, label, pct, checked) => {
        const each = Math.round(p.price * (1 - pct / 100))
        return `<label><span class="opt"><input type="radio" name="qty" value="${qty}" ${checked ? 'checked' : ''}><span>${label}${pct ? `<small>Save ${pct}% · ${money(each)} each</small>` : ''}</span></span><b>${money(each * qty)}</b></label>`
      }
      const shareText = encodeURIComponent(`${p.name} — ${p.tagline}`)
      const shareUrl = encodeURIComponent(url)
      main.innerHTML = `<div class="wrap">
        <div class="pdp__media"><img src="${img(p.image, 1100)}" alt="${esc(p.name)}" fetchpriority="high" decoding="async" width="1100" height="1100"></div>
        <div class="reveal">
          <div class="crumbs"><a href="/">Home</a> / <a href="/#shop">${p.category}</a></div>
          <h1>${esc(p.name)}</h1>
          <div class="tagline">${esc(p.tagline)}</div>
          <div class="pdp__price">${money(p.price)}${off >= 5 ? ` <s>${money(p.compareAt)}</s><span class="pill">Save ${off}%</span>` : ''}</div>
          <div>
            <form class="qty-pick" data-buy>
              ${opt(1, 'Just one', 0, true)}${opt(2, 'Two (one to gift)', t2)}${opt(3, 'Three', t3)}
              <button class="btn btn--block" type="submit">Add to cart</button>
            </form>
            <p class="pdp__desc">${esc(p.description)}</p>
            <ul class="ticks">${p.bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
            <div class="meta"><div><b>Ships tracked</b>Arrives in ${p.shipsIn}</div><div><b>Free shipping</b>On orders over ${money(offers.freeShippingThreshold)}</div><div><b>30-day returns</b>Refund if it isn't for you</div><div><b>Secure checkout</b>Cards, Apple Pay, Google Pay, Link &amp; pay later</div></div>
            <div class="share">
              <span>Share this gadget</span>
              <div class="share__row">
                <button class="chip" data-share-native>Share…</button>
                <a class="chip" href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" rel="noopener">Facebook</a>
                <a class="chip" href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener">X</a>
                <a class="chip" href="https://pinterest.com/pin/create/button/?url=${shareUrl}&description=${shareText}" target="_blank" rel="noopener">Pinterest</a>
                <button class="chip" data-share-copy>Copy link</button>
              </div>
            </div>
          </div>
        </div></div>`
      main.querySelector('[data-buy]').addEventListener('submit', (e) => {
        e.preventDefault()
        addToCart(p.slug, Number(new FormData(e.target).get('qty')))
      })
      const nativeBtn = main.querySelector('[data-share-native]')
      if (!navigator.share) nativeBtn.style.display = 'none'
      nativeBtn.addEventListener('click', () => navigator.share({ title: p.name, text: `${p.name} — ${p.tagline}`, url }).catch(() => {}))
      main.querySelector('[data-share-copy]').addEventListener('click', async (e) => {
        try {
          await navigator.clipboard.writeText(url)
          e.target.textContent = 'Copied!'
          setTimeout(() => (e.target.textContent = 'Copy link'), 1600)
        } catch {
          e.target.textContent = url
        }
      })
      document.querySelector('[data-related]').innerHTML = products
        .filter((x) => x.slug !== p.slug)
        .slice(0, 3)
        .map((x) => `<article class="card">
          <a class="card__media" href="/products/${x.slug}"><img src="${img(x.image, 640)}" alt="${esc(x.name)}" loading="lazy" decoding="async" width="640" height="640"></a>
          <button class="quick-add" data-add="${x.slug}" data-open="false">+ Quick add</button>
          <div class="card__body"><div><h3><a href="/products/${x.slug}">${esc(x.name)}</a></h3><p>${esc(x.tagline)}</p></div><div class="price">${money(x.price)}${x.compareAt ? `<s>${money(x.compareAt)}</s>` : ''}</div></div>
        </article>`)
        .join('')
    }
  </script>
</body>
</html>
